<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1e1e24" />

  <!-- Carla Graph Canvas Grid -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2d2d3a" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#grid)" />

  <!-- Node 1: MIDI Input -->
  <g transform="translate(40, 140)">
    <rect width="140" height="90" rx="8" fill="#2b3a4a" stroke="#4a90e2" stroke-width="2" />
    <text x="70" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MIDI Input</text>
    <circle cx="140" cy="60" r="6" fill="#e67e22" />
  </g>

  <!-- Node 2: Synth Plugin -->
  <g transform="translate(230, 120)">
    <rect width="150" height="110" rx="8" fill="#2e3b2e" stroke="#2ecc71" stroke-width="2" />
    <text x="75" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">FluidSynth LV2</text>
    <circle cx="0" cy="80" r="6" fill="#e67e22" />
    <circle cx="150" cy="50" r="6" fill="#3498db" />
    <circle cx="150" cy="80" r="6" fill="#3498db" />
  </g>

  <!-- Node 3: Audio Output -->
  <g transform="translate(430, 140)">
    <rect width="130" height="90" rx="8" fill="#4a2b2b" stroke="#e74c3c" stroke-width="2" />
    <text x="65" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Audio Output</text>
    <circle cx="0" cy="30" r="6" fill="#3498db" />
    <circle cx="0" cy="60" r="6" fill="#3498db" />
  </g>

  <!-- Connection Lines -->
  <!-- MIDI to Synth -->
  <path d="M 180 200 C 205 200, 205 200, 230 200" fill="none" stroke="#e67e22" stroke-width="3" />
  <!-- Synth L/R to Audio Out -->
  <path d="M 380 170 C 405 170, 405 170, 430 170" fill="none" stroke="#3498db" stroke-width="3" />
  <path d="M 380 200 C 405 200, 405 200, 430 200" fill="none" stroke="#3498db" stroke-width="3" />
</svg>
