<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" fill="#222226" rx="8"/>
  <text x="20" y="30" fill="#00d1b2" font-family="sans-serif" font-size="16" font-weight="bold">Carla Audio &amp; MIDI Routing Canvas</text>
  <!-- Input Node -->
  <rect x="40" y="80" width="140" height="70" fill="#363636" stroke="#00d1b2" stroke-width="2" rx="4"/>
  <text x="50" y="110" fill="#ffffff" font-family="sans-serif" font-size="12">System Capture</text>
  <text x="50" y="130" fill="#aaaaaa" font-family="sans-serif" font-size="10">Audio Out (2ch)</text>
  <!-- Plugin Node -->
  <rect x="230" y="80" width="140" height="70" fill="#363636" stroke="#3273dc" stroke-width="2" rx="4"/>
  <text x="240" y="110" fill="#ffffff" font-family="sans-serif" font-size="12">LV2 Equalizer</text>
  <text x="240" y="130" fill="#aaaaaa" font-family="sans-serif" font-size="10">Audio In/Out</text>
  <!-- Output Node -->
  <rect x="420" y="80" width="140" height="70" fill="#363636" stroke="#23d160" stroke-width="2" rx="4"/>
  <text x="430" y="110" fill="#ffffff" font-family="sans-serif" font-size="12">System Playback</text>
  <text x="430" y="130" fill="#aaaaaa" font-family="sans-serif" font-size="10">Audio In (2ch)</text>
  <!-- Connections -->
  <path d="M 180 115 L 230 115" stroke="#00d1b2" stroke-width="3" fill="none"/>
  <path d="M 370 115 L 420 115" stroke="#3273dc" stroke-width="3" fill="none"/>
</svg>
