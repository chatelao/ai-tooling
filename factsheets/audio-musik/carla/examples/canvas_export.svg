<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#1a1a24"/>
  <text x="300" y="30" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Carla Patchbay Topology Graph</text>

  <!-- Audio Input Node -->
  <rect x="50" y="150" width="140" height="80" rx="8" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
  <text x="120" y="185" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">Audio Input</text>
  <circle cx="190" cy="190" r="6" fill="#48bb78"/>

  <!-- Audio Output Node -->
  <rect x="410" y="150" width="140" height="80" rx="8" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
  <text x="480" y="185" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">Audio Output</text>
  <circle cx="410" cy="190" r="6" fill="#48bb78"/>

  <!-- Routing Line -->
  <path d="M 190 190 C 290 190, 310 190, 410 190" fill="none" stroke="#48bb78" stroke-width="3" stroke-dasharray="6,6"/>
</svg>
