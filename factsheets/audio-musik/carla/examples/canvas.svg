<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#222222" />
  <!-- Node 1: Audio Input -->
  <rect x="20" y="50" width="120" height="80" rx="8" fill="#334455" stroke="#5588aa" stroke-width="2" />
  <text x="80" y="95" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">Audio In</text>

  <!-- Node 2: Carla Rack / Gain -->
  <rect x="260" y="50" width="120" height="80" rx="8" fill="#443355" stroke="#aa55aa" stroke-width="2" />
  <text x="320" y="95" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">Carla Rack</text>

  <!-- Connection line -->
