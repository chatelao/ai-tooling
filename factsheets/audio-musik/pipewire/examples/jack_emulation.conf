# PipeWire JACK Emulation Wrapper Configuration File
# Configures the libpipewire-module-jack-tunnel for seamlessly running JACK audio applications.

jack.properties = {
    node.latency = 256/48000
    jack.short-name = true
    jack.filter-name = true
    jack.connect-32bit = true
    jack.self-connect-mode = allow
}

jack.rules = [
    {
        matches = [
            {
                application.process.binary = "csound"
            },
            {
                application.process.binary = "pure-data"
            }
        ]
        actions = {
            update-props = {
                node.latency = 128/48000
                node.force-quantum = 128
            }
        }
    }
]
