version: "1.1"
name: API Regression Test
tests:
  get-users:
    steps:
      - name: Fetch users
        http:
          url: http://localhost:8080/api/users
          method: GET
        check:
          status: 200
          json:
            - path: "$.length"
              operator: ">"
              value: 0
  create-user:
    steps:
      - name: Create a new user
        http:
          url: http://localhost:8080/api/users
          method: POST
          body:
            name: "Test User"
            email: "test@example.com"
        check:
          status: 201
          json:
            - path: "$.name"
              value: "Test User"
