version: "1.1"
name: GraphQL API Test
tests:
  graphql-query:
    steps:
      - name: Query user profile
        http:
          url: http://localhost:8080/graphql
          method: POST
          body:
            query: |
              query GetUser($id: ID!) {
                user(id: $id) {
                  id
                  username
                  email
                }
              }
            variables:
              id: "123"
        check:
          status: 200
          json:
            - path: "$.data.user.username"
              value: "admin"
