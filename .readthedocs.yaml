version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - libpango-1.0-0
    - libharfbuzz0b
    - libpangoft2-1.0-0
  jobs:
    pre_build:
      - mkdir -p docs
      - ln -s ../factsheets docs/
      - ln -s ../README.md docs/
      - ln -s ../GEMINI.md docs/
      - ln -s ../TOOLS.md docs/
      - ln -s ../DATASOURCES.md docs/
      - ln -s ../VISUALIZATION.md docs/
      - ln -s ../FACTSHEET_ROADMAP.md docs/
      - python scripts/generate_mkdocs_config.py

python:
  install:
    - requirements: docs-requirements.txt

mkdocs:
  configuration: mkdocs.yml
